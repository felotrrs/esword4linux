[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "linuxesword"
version = "0.1.0"
description = "Lector nativo de módulos e-Sword para Linux (sin Wine)"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-only"
authors = [{ name = "linuxEsword" }]
dependencies = [
    "PySide6-Essentials>=6.6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
linuxesword = "linuxesword.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"linuxesword.i18n" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
